name = "ansend"
compatibility_date = "2026-06-08"
main = "src/worker.mjs"

[vars]
OPENAI_MODEL = "gpt-5.4-mini"
NEXO_FALLBACK_MODELS = "gpt-5-mini,gpt-4.1-mini"
NEXO_MAX_OUTPUT_TOKENS = "2200"
NEXO_REASONING_EFFORT = "low"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
